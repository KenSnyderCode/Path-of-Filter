[project]
name = "poe2-loot-filter-generator"
version = "0.1.0"
description = "Fetches PoE2 economy data from poe.ninja and generates a tiered, auto-updating loot filter"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
