name: CI

on:
  pull_request:
    paths:
      - "generator/**"
      - "tests/**"
      - "client_updater/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "generator/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r generator/requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
