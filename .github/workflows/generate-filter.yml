name: Generate loot filter

on:
  schedule:
    - cron: "17 7 * * *" # daily, off the hour to avoid GitHub Actions' peak-minute congestion
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-filter
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: pip install -r generator/requirements.txt

      - name: Generate filter
        run: python -m generator.main

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- dist/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated filter
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "poe2-loot-filter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/
          git commit -m "chore: regenerate loot filter [skip ci]"
          git push
