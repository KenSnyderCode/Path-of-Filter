name: Build client updater

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0) — used when run manually, ignored on a tag push"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r client_updater/requirements.txt
          pip install pyinstaller

      - name: Build updater.exe
        working-directory: client_updater
        run: pyinstaller --distpath pyinstaller_dist --workpath pyinstaller_build updater.spec

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=client-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: client_updater/pyinstaller_dist/PoE2LootFilterUpdater.exe
          generate_release_notes: true
