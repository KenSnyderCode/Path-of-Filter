name: Build client updater

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r client_updater/requirements.txt
          pip install pyinstaller

      - name: Build updater.exe
        working-directory: client_updater
        run: pyinstaller --distpath pyinstaller_dist --workpath pyinstaller_build updater.spec

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: client_updater/pyinstaller_dist/PoE2LootFilterUpdater.exe
          generate_release_notes: true
